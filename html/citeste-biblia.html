  <section class="page" id="page-biblereader">
    <div class="bible-reader-layout">

      <!-- LEFT: Navigation + Notes -->
      <div class="bible-sidebar">
        <!-- Book selector -->
        <div class="bible-nav-card">
          <div class="bible-nav-header">
            <button type="button" class="bible-nav-title bible-nav-title-img-btn" onclick="backToBooks()" title="Citește Biblia — înapoi la lista de cărți">
              <img src="assets/citeste-biblia.webp" alt="Citește Biblia" class="bible-nav-title-img" />
            </button>
            <a href="https://www.jw.org/ro/biblioteca/biblia/biblia-de-studiu/c%C4%83r%C8%9Bi/" target="_blank" class="jw-badge">jw.org/ro ↗</a>
          </div>

          <div class="bible-testament-tabs">
            <button class="testament-tab active" id="tab-ot" onclick="switchTestament('ot')">Scripturile Ebraice</button>
            <button class="testament-tab" id="tab-nt" onclick="switchTestament('nt')">Scripturile Grecești</button>
          </div>

          <div class="bible-books-grid" id="bibleBooksList"></div>
        </div>

        <!-- Chapter selector -->
        <div class="bible-nav-card" id="chapterSelectorCard" style="display:none">
          <div class="bible-chap-header">
            <button class="btn-ghost btn-sm" onclick="backToBooks()">← Înapoi</button>
            <span class="bible-book-name" id="selectedBookName"></span>
          </div>
          <div class="bible-chapters-grid" id="bibleChaptersList"></div>
        </div>

      </div>

      <!-- RIGHT: Editor integrat direct în pagină, fără popup/modal -->
      <div class="bible-reading-panel">

        <!-- Placeholder când nu este selectat niciun capitol (zonă goală) -->
        <div class="bible-inline-placeholder" id="bibleWelcome">
        </div>

        <!-- Editor capitol – apare direct în panou când se selectează un capitol -->
        <div class="bible-chapter-view" id="bibleChapterView" style="display:none">

          <!-- Bara de navigare capitol -->
          <div class="chapter-view-header">
            <div class="chapter-nav-btns">
              <button class="chapter-nav-btn" id="btnPrevChap" onclick="navigateChapter(-1)">‹ Anterior</button>
              <h2 class="chapter-title" id="chapterTitle"></h2>
              <button class="chapter-nav-btn" id="btnNextChap" onclick="navigateChapter(1)">Următor ›</button>
            </div>
            <a id="jwReadLink" href="#" target="_blank" rel="noopener" class="jw-badge" style="margin-top:6px;display:inline-block">
              Citește pe jw.org ↗
            </a>
          </div>

          <!-- Notițe capitol -->
          <div class="bible-inline-section">
            <p class="bible-inline-label">📝 Notițe – <span id="chapterNotesBadge"></span></p>
            <textarea class="form-textarea" id="chapterNotesText"
              style="min-height:120px"
              placeholder="Scrie notițe, impresii sau versete marcate din acest capitol..."
              oninput="autoSaveChapterNote()"></textarea>
          </div>

          <!-- Versete marcate -->
          <div class="bible-inline-section">
            <p class="bible-inline-label">⭐ Versete marcate</p>
            <div class="marked-verse-input">
              <input type="text" id="markedVerseRef" class="form-input" placeholder="ex: v.3, v.16-18" />
              <button class="btn-primary btn-sm" onclick="addMarkedVerse()">+ Marchează</button>
            </div>
            <div id="markedVersesList" class="marked-verses-list"></div>
          </div>

          <!-- Text capitol lipit/scris de utilizator -->
          <div class="bible-inline-section">
            <div style="display:flex;align-items:center;justify-content:space-between">
              <p class="bible-inline-label" style="margin:0">📄 Textul capitolului (local)</p>
              <div class="year-text-actions" style="display:flex">
                <button class="yt-menu-btn" id="bibleTextColorMenuBtn" onclick="event.stopPropagation(); toggleBibleTextColorMenu()" title="Culoare text">
                  <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="8.5" cy="10" r="1.3" fill="currentColor"/><circle cx="12" cy="8" r="1.3" fill="currentColor"/><circle cx="15.5" cy="10" r="1.3" fill="currentColor"/><circle cx="9.5" cy="14" r="1.3" fill="currentColor"/></svg>
                </button>
                <div class="year-text-dropdown" id="bibleTextColorDropdown" style="width:150px">
                  <div class="year-color-picker" style="margin-bottom:0">
                    <button class="color-swatch active" style="background:#e6edf3" data-color="#e6edf3" onclick="selectBibleTextColor(this)" title="Alb"></button>
                    <button class="color-swatch" style="background:#e53e3e" data-color="#e53e3e" onclick="selectBibleTextColor(this)" title="Roșu"></button>
                    <button class="color-swatch" style="background:#805ad5" data-color="#805ad5" onclick="selectBibleTextColor(this)" title="Mov"></button>
                    <button class="color-swatch" style="background:#4299e1" data-color="#4299e1" onclick="selectBibleTextColor(this)" title="Albastru"></button>
                    <button class="color-swatch" style="background:#48bb78" data-color="#48bb78" onclick="selectBibleTextColor(this)" title="Verde"></button>
                    <button class="color-swatch" style="background:#ecc94b" data-color="#ecc94b" onclick="selectBibleTextColor(this)" title="Galben"></button>
                    <button class="color-swatch" style="background:#ed8936" data-color="#ed8936" onclick="selectBibleTextColor(this)" title="Portocaliu"></button>
                    <button class="color-swatch" style="background:#ed64a6" data-color="#ed64a6" onclick="selectBibleTextColor(this)" title="Roz"></button>
                    <button class="color-swatch" style="background:#38b2ac" data-color="#38b2ac" onclick="selectBibleTextColor(this)" title="Turcoaz"></button>
                    <button class="color-swatch" style="background:#d4af37" data-color="#d4af37" onclick="selectBibleTextColor(this)" title="Auriu"></button>
                  </div>
                </div>
              </div>
            </div>
            <p style="font-size:0.78rem;color:var(--text-muted);margin:0 0 8px">
              Lipește sau scrie textul versetelor. Salvat automat, doar pe acest dispozitiv.
            </p>
            <textarea class="form-textarea" id="chapterVerseText"
              style="min-height:200px;font-size:0.92rem;line-height:1.65"
              placeholder="Lipește aici textul capitolului..."
              oninput="autoSaveChapterVerseText()"></textarea>
          </div>

          <!-- Notițe salvate – afișare -->
          <div class="chapter-notes-display" id="chapterNotesDisplay"></div>

          <!-- Highlights versete marcate -->
          <div class="chapter-highlights" id="chapterHighlights"></div>

        </div>
      </div>
    </div>
  </section>

  <!-- PAGE: BIBLIOTECĂ -->
